[project]
name = "daphnis"
version = "0.1.0"
description = "Agent harness built on saturnus-llm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "python-dotenv>=1.2.4",
    "saturnus-llm",
    "textual>=8.2.8",
]

[project.scripts]
daphnis = "daphnis.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
saturnus-llm = { path = "../Saturnus", editable = true }
