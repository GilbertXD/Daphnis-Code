[project]
name = "daphnis"
version = "0.1.0"
description = "Agent harness built on saturnus-llm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16,<3",
    "mcp>=2,<3",
    "python-dotenv>=1.2.4",
    "saturnus-llm==0.1.1",
    "textual>=8.2.8",
]

[project.scripts]
daphnis = "daphnis.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.4"]
