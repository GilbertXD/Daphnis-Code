[project]
name = "daphnis"
version = "0.1.0"
description = "Local coding agent with built-in model communication."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.16,<3",
    "jsonschema>=4.26.0",
    "mcp>=2,<3",
    "pillow>=12.3,<14",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3,<7",
    "uritemplate>=4.2,<5",
]

[project.optional-dependencies]
web = [
    "python-multipart>=0.0.33,<1",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "websockets>=15,<17",
]

[project.scripts]
daphnis-web = "daphnis.web.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.4"]
