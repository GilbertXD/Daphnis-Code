[project]
name = "daphnis"
version = "0.1.0"
description = "Agent harness built on saturnus-llm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16,<3",
    "mcp>=2,<3",
    "python-dotenv>=1.2.4",
    "saturnus-llm==0.1.1",
    "uritemplate>=4.2,<5",
]

[project.optional-dependencies]
web = ["starlette>=1.10,<2", "uvicorn>=0.54,<1", "websockets>=15,<17"]

[project.scripts]
daphnis-web = "daphnis.web.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.4"]
